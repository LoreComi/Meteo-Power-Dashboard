command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"

env:
  - name: DATABRICKS_SQL_WAREHOUSE_HTTP_PATH
    description: "HTTP path of the SQL warehouse"
    value: "/sql/1.0/warehouses/2f4ff6b7c65abb1a"
  - name: POWER_DESK_SCHEMA
    description: "Sandbox schema written by power_desk_refresh.py"
    value: "dna_snbx_weather.power_desk"
  - name: VOLUE_SCHEMA
    description: "Volue delta-share schema — the app reads it live for Morning Call and Gas Demand"
    value: "dna_prod_silver.volue_deltashare"
  - name: METEOMATICS_MEMBER_TABLE
    description: "Optional per-member Meteomatics table; empty = cluster on Volue members"
    value: ""
  - name: METEOLOGICA_TABLE
    description: "Optional Meteologica table; empty = tab shows not-ingested notice"
    value: ""
  - name: GOLD_SCHEMA
    description: "Gold-layer Meteomatics climatology schema (ERA5 gridded anomalies for maps)"
    value: "dna_prod_gold.weather"
  - name: AI_BRIEF_MODEL
    description: "Azure OpenAI deployment used by the Morning Call agent families"
    value: "gpt-4o"
  - name: AZURE_TENANT_ID
    valueFrom: azure-tenant-id
  - name: AZURE_CLIENT_ID
    valueFrom: azure-client-id
  - name: AZURE_CLIENT_SECRET
    valueFrom: azure-client-secret

resources:
  - name: sql-warehouse
    sql_warehouse:
      id: "2f4ff6b7c65abb1a"
      permission: CAN_USE
  # Azure OpenAI service principal for the Morning Call agent families. Same
  # scope and keys the coal dashboard uses, so a workspace already set up for
  # that app needs nothing new. Without these the Morning Call still renders
  # the full table; only the commentary is unavailable.
  - name: azure-tenant-id
    secret:
      scope: "commodity-news-secrets"
      key: "azure-tenant-id"
      permission: READ
  - name: azure-client-id
    secret:
      scope: "commodity-news-secrets"
      key: "azure-client-id"
      permission: READ
  - name: azure-client-secret
    secret:
      scope: "commodity-news-secrets"
      key: "azure-client-secret"
      permission: READ
