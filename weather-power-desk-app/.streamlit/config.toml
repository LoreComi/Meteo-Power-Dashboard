[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f4"
textColor = "#1a1a18"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[client]
toolbarMode = "viewer"
# no tracebacks on the page: app.py logs them to stdout (the Apps log) instead
showErrorDetails = false
